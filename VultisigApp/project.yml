name: VultisigApp

# XcodeGen-generated project. Do NOT edit VultisigApp.xcodeproj/project.pbxproj
# directly — run `make generate` from the repo root after changing this file
# or after adding/removing/renaming Swift sources.
# See ../docs/refactors/01-xcodegen.md (workspace-level) for migration context.

options:
  createIntermediateGroups: true
  generateEmptyDirectories: false
  deploymentTarget:
    iOS: "17.0"
    macOS: "15.0"
  groupSortPosition: top
  developmentLanguage: en
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.41.0"
  # Keep Package.resolved tracked even when the xcodeproj is regenerated.
  transitivelyLinkDependencies: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 5BP27CHH4Y
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "1.45"
    CURRENT_PROJECT_VERSION: "71"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    DEAD_CODE_STRIPPING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

configs:
  Debug: debug
  Release: release

packages:
  # ---- Remote SPM packages (versions from Package.resolved) ----
  BigInt:
    url: https://github.com/attaswift/BigInt.git
    from: 5.1.0
  CodeScanner:
    url: https://github.com/twostraws/CodeScanner
    from: 2.3.3
  CryptoSwift:
    url: https://github.com/krzyzanowskim/CryptoSwift.git
    from: 1.8.2
  RiveRuntime:
    url: https://github.com/rive-app/rive-ios
    from: 6.5.11
  SwiftLintPlugins:
    url: https://github.com/SimplyDanny/SwiftLintPlugins
    from: 0.63.1
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.17.0
  VultisigCommonData:
    url: https://github.com/vultisig/commondata
    # Pinned to the commondata commit that adds `RippleSpecific.transaction_type
    # = 5` (the existing `TransactionType` enum) plus
    # `TRANSACTION_TYPE_RIPPLE_TRUST_SET = 10`. That commit is merged: it is an
    # ancestor of commondata `main`, not a branch-only revision.
    #
    # Why the field exists: an XRPL issued-currency coin is ambiguous on its own.
    # The same (currency, issuer) pair can mean "open a trust line for this
    # token" — a TrustSet whose keysign amount is the trust-line LIMIT — or "send
    # this token", a Payment carrying a `CurrencyAmount`. Those serialize to
    # different signed bytes, so in MPC keysign the discriminator has to be on
    # the wire rather than inferred. A proto3 enum defaults to
    # `TRANSACTION_TYPE_UNSPECIFIED` and is absent from the wire when unset, so
    # native XRP payloads stay byte-identical; a signer predating the field still
    # infers TrustSet from a non-native coin, which keeps a TrustSet
    # byte-identical across mixed-version committees.
    #
    # This commit is a linear descendant of the pin that added `SignRipple {
    # string raw_json }` at `sign_ripple = 46` (the XRPL dApp co-signer
    # passthrough) and, before that, `RippleSpecific.destination_tag` (optional
    # uint32) — the first-class XRPL DestinationTag field the initiator
    # dual-writes into BOTH the field AND the legacy memo carrier, with signers
    # preferring the field and falling back to the memo so mixed-version device
    # pairs stay byte-identical in MPC keysign.
    #
    # Advanced to commondata `main`'s current HEAD per review request. Verified
    # first: every commit between the prior pin and this one only touches repo
    # tooling (`CLAUDE.md`, `.claude/hooks`, issue/PR templates) — no `.proto`
    # file changed, so this is a no-op for generated Swift.
    revision: 63a65c37c50f6a944f6791d36eb905810af82760
  WalletCore:
    url: https://github.com/vultisig/walletcore-spm
    # v4.7.1 is the correctly-cut release for wallet-core 4.7.0 (tag →
    # 628900b25d…, walletcore-spm main), which adds the Cardano
    # `CardanoSigningInput.auxiliaryData` field this feature needs. Do NOT use
    # `exactVersion: 4.7.0` — that tag is mis-cut and resolves to the old
    # 4.6.13 commit (6fe770f97…).
    exactVersion: 4.7.1
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.0
  # ---- Local SPM package ----
  Mediator:
    path: ../Mediator

targets:
  # ========================================================================
  #  VultisigApp — main iOS + macOS application
  # ========================================================================
  VultisigApp:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "15.0"

    sources:
      - path: VultisigApp
        excludes:
          - "**/.DS_Store"
          - "Preview Content/**"
      - path: VultisigApp/Preview Content
        buildPhase: resources
      # Xcode 16 icon-stack bundle lives alongside the source folder.
      - path: Vultisig-Logo.icon
        buildPhase: resources
      # Info.plist and entitlements files are referenced via build settings
      # below, not via XcodeGen's `info:` / `entitlements:` blocks (which
      # would regenerate and overwrite them).

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vultisig.wallet
        PRODUCT_NAME: $(TARGET_NAME)
        INFOPLIST_FILE: VultisigApp/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: VultisigApp/VultisigApp.entitlements
        CODE_SIGN_IDENTITY: "Apple Development"
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "Apple Development"
        TARGETED_DEVICE_FAMILY: "1,2"
        # We don't support visionOS — hide "Apple Vision (Designed for iPad)"
        # from Supported Destinations.
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

        # Hardened runtime / sandbox (macOS)
        ENABLE_HARDENED_RUNTIME: YES
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_INCOMING_NETWORK_CONNECTIONS: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES

        # Resource access
        ENABLE_RESOURCE_ACCESS_CAMERA: YES
        ENABLE_RESOURCE_ACCESS_PHOTO_LIBRARY: YES
        ENABLE_USER_SELECTED_FILES: readwrite

        # Asset catalog
        ASSETCATALOG_COMPILER_APPICON_NAME: Vultisig-Logo
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

        # Runtime paths
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks"
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "@executable_path/../Frameworks"

        # Previews / dead code
        DEVELOPMENT_ASSET_PATHS: '"VultisigApp/Preview Content"'
        ENABLE_PREVIEWS: YES
        DEAD_CODE_STRIPPING: YES
        REGISTER_APP_GROUPS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

        # Info.plist keys (merged at build time because GENERATE_INFOPLIST_FILE=YES)
        INFOPLIST_KEY_CFBundleDisplayName: Vultisig
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_NSCameraUsageDescription: Allow access to your camera to scan QR codes so you can pair devices for vault setup, import vaults and wallet addresses, and confirm transaction details when signing.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Secure your Vault using Face ID
        INFOPLIST_KEY_NSFileProviderDomainUsageDescription: Allow access to your files to back up your vault to and restore it from your chosen file storage.
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Allow access to your local network to discover and connect to your other devices on the same Wi-Fi so they can pair and sign transactions together.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Allow access to your photo library to save vault backup QR codes and select saved QR code images to import vaults or addresses.
        "INFOPLIST_KEY_NSScreenCaptureUsageDescription[sdk=macosx*]": "Vultisig needs screen recording permission to scan QR codes displayed on your screen."
        "INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphoneos*]": YES
        "INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphonesimulator*]": YES
        "INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents[sdk=iphoneos*]": YES
        "INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents[sdk=iphonesimulator*]": YES
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphoneos*]": YES
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphonesimulator*]": YES
        "INFOPLIST_KEY_UIStatusBarStyle[sdk=iphoneos*]": UIStatusBarStyleDefault
        "INFOPLIST_KEY_UIStatusBarStyle[sdk=iphonesimulator*]": UIStatusBarStyleDefault
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        INFOPLIST_KEY_UISupportsDocumentBrowser: YES

      configs:
        Debug:
          # Master logging switch. LOGGING gates the `Log` facade: present here so
          # Debug compiles the real os.Logger path; absent in Release so `Log.*`
          # collapses to `Logger(.disabled)`. DEBUG is listed explicitly because
          # overriding this key replaces XcodeGen's debug-config default.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG LOGGING"
          # Default VULTI_LOG selector string, surfaced to the app via the
          # Info.plist `VultiLogConfig` key (which expands `$(VULTI_LOG_CONFIG)`).
          VULTI_LOG_CONFIG: "*:info"
        Release:
          # Matches the current pbxproj — Release is effectively Debug-like.
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          ENABLE_TESTABILITY: YES
          ALLOW_TARGET_PLATFORM_SPECIALIZATION: YES
          # No LOGGING flag here → logging is compiled out; keep the plist default off.
          VULTI_LOG_CONFIG: "*:off"

    dependencies:
      # ---- Local embedded xcframeworks (link-only, no embed) ----
      # NOTE: The current pbxproj pins an `expectedSignature` per xcframework.
      # XcodeGen does not yet surface that attribute; after running `xcodegen
      # generate` for the first time, verify in Xcode (General → Frameworks)
      # that each xcframework's "Do Not Embed" state and signature tags match
      # the values documented in docs/refactors/01-xcodegen.md.
      - framework: Tss.xcframework
        embed: false
      - framework: godkls.xcframework
        embed: false
      - framework: goschnorr.xcframework
        embed: false
      - framework: vscore.xcframework
        embed: false

      # ---- Remote SPM ----
      - package: BigInt
      - package: CodeScanner
      - package: CryptoSwift
      - package: RiveRuntime
      - package: VultisigCommonData
      - package: WalletCore
        product: WalletCore
      - package: WalletCore
        product: WalletCoreSwiftProtobuf
      - package: ZIPFoundation

      # ---- Local SPM ----
      - package: Mediator
        product: Mediator

    # SwiftPM build-tool plugin (runs before compile).
    buildToolPlugins:
      - plugin: SwiftLintBuildToolPlugin
        package: SwiftLintPlugins

  # ========================================================================
  #  VultisigAppTests — unit tests (iOS)
  # ========================================================================
  VultisigAppTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    deploymentTarget:
      iOS: "17.2"
      macOS: "14.2"

    sources:
      - path: VultisigAppTests
        excludes:
          - "**/.DS_Store"
          # Never flatten docs into the test bundle. Fixture directories carry
          # `README.md` files (e.g. `Fixtures/README.md`, the qbtc-voteweighted
          # tool README); depending on the XcodeGen version's `dir/**` glob
          # semantics these can each flatten to the bundle root as `README.md`
          # and collide ("Multiple commands produce …/README.md") — a clean-build
          # failure CI hits but an incremental local build can miss. Markdown is
          # never a test resource, so exclude it wholesale.
          - "**/*.md"
          # Exclude the fixture JSONs from the generic-sources scan; they're
          # picked up explicitly below as folder references so each set keeps
          # its own directory inside the bundle. Without these excludes,
          # XcodeGen treats every `.json` under the tree as a flattened
          # resource, so unrelated suites' fixtures all land side by side in
          # the bundle's resource root with no way to tell them apart.
          - "Swap/SwapKit/__fixtures__/**"
          - "Blockchain/Cosmos/Staking/CosmosStakingFixtures/**"
          - "TestData/**"
          # The QBTC weighted-vote vector generator is a committed Node/cosmjs
          # tool (generate.mjs + package.json + README + node_modules), not test
          # code or a bundled resource. Excluding it keeps its .js/.ts/.map
          # files from being flattened into the test bundle root (which
          # collides under "Multiple commands produce").
          - "Blockchain/Cosmos/Signing/fixtures/qbtc-voteweighted/**"
      # Static fixture JSONs bundled with the test target as *folder
      # references* (blue folders in Xcode) so they keep their directory
      # inside the bundle instead of flattening into the resource root.
      # `TestData` in particular is the golden signing-vector corpus: keeping
      # it addressable as a directory lets `ChainHelperTests` enumerate
      # exactly its own fixtures and assert every one of them is executed,
      # instead of guessing which of a flat pile of JSON files belongs to it.
      - path: VultisigAppTests/Swap/SwapKit/__fixtures__
        type: folder
        buildPhase: resources
      - path: VultisigAppTests/Blockchain/Cosmos/Staking/CosmosStakingFixtures
        type: folder
        buildPhase: resources
      - path: VultisigAppTests/TestData
        type: folder
        buildPhase: resources

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voltix.voltixAppTests
        PRODUCT_NAME: $(TARGET_NAME)
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VultisigApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/VultisigApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TARGETED_DEVICE_FAMILY: "1,2"
        # We don't support visionOS — hide "Apple Vision (Designed for iPad)"
        # from Supported Destinations.
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        DEAD_CODE_STRIPPING: YES
        REGISTER_APP_GROUPS: YES
        SWIFT_EMIT_LOC_STRINGS: NO

    dependencies:
      - target: VultisigApp
      - package: SnapshotTesting

  # ========================================================================
  #  VultisigAppUITests — UI tests
  # ========================================================================
  VultisigAppUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.2"
      macOS: "14.2"

    sources:
      - path: VultisigAppUITests
        excludes:
          - "**/.DS_Store"
      # A UI-test bundle links nothing from the app, so the shared identifier
      # constants have to be compiled into it as well. Without this the whole
      # target fails to build ("cannot find 'AccessibilityID' in scope") and
      # every UI test is unrunnable, not merely skipped.
      - path: VultisigApp/Core/Utils/AccessibilityID.swift

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voltix.voltixAppUITests
        PRODUCT_NAME: $(TARGET_NAME)
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VultisigApp
        TARGETED_DEVICE_FAMILY: "1,2"
        # We don't support visionOS — hide "Apple Vision (Designed for iPad)"
        # from Supported Destinations.
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        DEAD_CODE_STRIPPING: YES
        SWIFT_EMIT_LOC_STRINGS: NO

    dependencies:
      - target: VultisigApp

# ============================================================================
#  Schemes — kept explicit so CI and fastlane see the same names as before.
# ============================================================================
schemes:
  VultisigApp:
    build:
      targets:
        VultisigApp: all
    run:
      config: Debug
      # Array form (not the `{KEY: {value, isEnabled}}` map): the map form is not
      # supported by XcodeGen — it stringifies the inner dict and forces
      # isEnabled=YES. The array form honours `isEnabled: false`.
      environmentVariables:
        - variable: OS_ACTIVITY_MODE
          value: disable
          isEnabled: false
        # Per-run override for the Log facade gate. Disabled by default so the
        # Info.plist `VultiLogConfig` default applies; flip `isEnabled` on (or edit
        # the value) to narrow logging without a rebuild, e.g. "swap:debug,*:off".
        - variable: VULTI_LOG
          value: "swap:debug,.network:info,*:off"
          isEnabled: false
    test:
      config: Debug
      testPlans:
        - path: VultisigApp.xctestplan
          defaultPlan: true
      targets:
        - VultisigAppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  VultisigAppUITests:
    build:
      targets:
        # Host app only needs to launch (`run`) — UITests don't exercise its
        # unit tests, so dropping `test` keeps the UITest build lighter.
        VultisigApp: [run]
        VultisigAppUITests: [test]
    run:
      config: Debug
      executable: VultisigApp
    test:
      config: Debug
      testPlans:
        - path: VultisigAppUITests.xctestplan
          defaultPlan: true
      targets:
        - VultisigAppUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
